<html>
    <body style="text-align:center; margin-top:100px;">
        
        <h1>🛒 Shopping Cart</h1>

        <input type="text" id="foodName" placeholder="Please Enter a Food Item">
        
        <button onclick="foodItems()">Add Food</button>
        <button onclick="emptyCart()" style="color: red;">Empty Cart</button>
        
        <p id="counterDisplay"></p>
        <p id="message"></p>
        
        <script>
            // 1. Hamara Godaam (Array)
            let food = ["Rice", "Daal"];
            
            // 2. Naya Item Add karne ka function
            function foodItems() {
                let newFood = document.getElementById("foodName").value;
                document.getElementById("foodName").value = "";
                
                // Agar input khali nahi hai, tabhi godaam mein daalo
                if (newFood) { 
                    food.push(newFood); 
                }
                
                // Total Count Update (if-block ke bahar, taaki hamesha chale)
                document.getElementById("counterDisplay").innerText = "Total Items: " + food.length;  
                
                // Loop chalakar list sajana
                let text = "";
                for (let i = 0; i < food.length; i++) {
                    text = text + food[i] + " ";
                }
                
                // Saji hui list screen par dikhana
                document.getElementById("message").innerText = text;
            }

            // 3. Godaam Khali karne ka function (Danger Zone!)
            function emptyCart() {
                food = []; // Godaam ko khali dabba bana diya
                document.getElementById("message").innerText = ""; // Screen se list mita di
                document.getElementById("counterDisplay").innerText = "Total Items: 0"; // Counter ko zero kar diya
            }
            
        </script>
    </body>
</html>
