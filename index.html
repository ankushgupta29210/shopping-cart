<html>
    <body style="text-align:center; margin-top:50px; font-family: Arial;">
        
        <h1>🛒 The Supermarket App</h1>

        <input type="text" id="foodName" placeholder="Enter a Food Item">
        <button onclick="foodItems()" style="background-color: lightgreen;">Add Food</button>
        <button onclick="undoItem()" style="background-color: yellow;">Undo Last Item ↩️</button>
        <button onclick="emptyCart()" style="background-color: pink;">Empty Cart 🗑️</button>
        
        <p id="counterDisplay">Total Items: 0</p>
        <p id="billDisplay">Your Bill: $0</p>
        <p id="message" style="font-size: 20px; font-weight: bold;"></p>
        
        <hr> <h2>🔍 Search in Godown</h2>
        <input type="text" id="searchBox" placeholder="Search Item...">
        <button onclick="searchItem()">Search</button>
        <p id="searchResult"></p>
        
        <script>
            // 1. Hamara Godaam ab bilkul khali hai!
            let food = [];
            
            // FUNCTION 1: Naya item add karna
            function foodItems() {
                let newFood = document.getElementById("foodName").value;
                document.getElementById("foodName").value = "";
                
                if (newFood) { 
                    food.push(newFood); 
                }
                
                // Counter aur Bill Update (Har item $5 ka hai)
                document.getElementById("counterDisplay").innerText = "Total Items: " + food.length;  
                let billAmount = food.length * 5;
                document.getElementById("billDisplay").innerText = "Your Bill: $" + billAmount;
                
                // Loop chalakar list sajana
                let text = "";
                for (let i = 0; i < food.length; i++) {
                    text = text + food[i] + " ";
                }
                document.getElementById("message").innerText = text;
            }

            // FUNCTION 2: Aakhiri item hatana (Undo)
            function undoItem() {
                food.pop(); // Godaam se aakhiri item nikal do
                
                // Item hatne ke baad Counter aur Bill wapas update karo
                document.getElementById("counterDisplay").innerText = "Total Items: " + food.length;  
                let billAmount = food.length * 5;
                document.getElementById("billDisplay").innerText = "Your Bill: $" + billAmount;
                
                // List ko wapas naye tareeqe se sajakar dikhao
                let text = "";
                for (let i = 0; i < food.length; i++) {
                    text = text + food[i] + " ";
                }
                document.getElementById("message").innerText = text;
            }

            // FUNCTION 3: Godaam Khali karna
            function emptyCart() {
                food = []; // Godaam khali
                document.getElementById("message").innerText = ""; 
                document.getElementById("counterDisplay").innerText = "Total Items: 0"; 
                document.getElementById("billDisplay").innerText = "Your Bill: $0"; 
                document.getElementById("searchResult").innerText = ""; // Search result bhi mita do
            }

            // FUNCTION 4: Godaam mein item dhundna
            function searchItem() {
                let word = document.getElementById("searchBox").value;
                
                // Agar word mila, toh Haan bolo, nahi toh Naa.
                if (food.includes(word)) {
                    document.getElementById("searchResult").innerText = "Haan! " + word + " godaam mein hai! ✅";
                } else {
                    document.getElementById("searchResult").innerText = "Nahi! " + word + " nahi mila. ❌";
                }
            }
            
        </script>
    </body>
</html>
