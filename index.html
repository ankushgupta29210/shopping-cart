<html>
    <body style="text-align:center; margin-top:50px;">

        <button onclick="darkMode()">Dark Mode</button>
        <br><br>

        <h1>Ruby's Smart Café Manager</h1>

        <h3 id="counterDisplay">Total Menu Items: 0</h3>

        <p id="errorMessage" style="color:red;"></p>

        <input type="text" id="itemBox" placeholder="Enter Food or Drink">
        <button onclick="addItem()">Add Item</button>
        <br><br>

        <button onclick="undoLast()">Undo Last Item</button>
        <br><br>
        <hr>

        <div id="menuList"></div>

        <script>
            // 2. The Array to store all items
            let menuItems = [];

            // The Reusable Function to update the screen
            function updateScreen() {
                
                // Update the live counter
                document.getElementById("counterDisplay").innerText = "Total Menu Items: " + menuItems.length;

                // Clear any old error messages
                document.getElementById("errorMessage").innerText = "";

                // Loop through the array and build the list with Delete buttons
                let text = "";
                for (let i = 0; i < menuItems.length; i++) {
                    
                    // 4. Specific Delete Button (Splice) using the index 'i'
                    text = text + menuItems[i] + " <button onclick='deleteSpecific(" + i + ")'>Delete</button><br><br>";
                }
                
                // Push the final built text to the screen using innerHTML
                document.getElementById("menuList").innerHTML = text;
            }

            function addItem() {
                // Grab the text from the box
                let newItem = document.getElementById("itemBox").value;

                // Check if the input is empty
                if (newItem == "") {
                    document.getElementById("errorMessage").innerText = "Error: Please enter an item first!";
                } else {
                    // Add to array
                    menuItems.push(newItem);
                    
                    // 6. Auto-Clear the input box
                    document.getElementById("itemBox").value = "";
                    
                    // Refresh the screen
                    updateScreen();
                }
            }

            function undoLast() {
                // Check if the array is already empty
                if (menuItems.length == 0) {
                    document.getElementById("errorMessage").innerText = "Error: Nothing to undo!";
                } else {
                    // Remove the very last item
                    menuItems.pop();
                    
                    // Refresh the screen
                    updateScreen();
                }
            }

            function deleteSpecific(index) {
                // Remove exactly 1 item starting at the specific index position
                menuItems.splice(index, 1);
                
                // Refresh the screen
                updateScreen();
            }

            function darkMode() {
                // Change CSS to dark mode
                document.body.style.backgroundColor = "black";
                document.body.style.color = "white";
            }

        </script>
    </body>
</html>
